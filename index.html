<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Geek & Tech | Projeto Portfólio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cabeçalho Principal -->
    <header class="main-header">
        <div class="logo">
            <h1>Geek<span>Portal</span></h1>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="#destaques">Destaques</a></li>
                <li><a href="#curiosidades">Curiosidades</a></li>
                <li><a href="#sobre">Sobre o Projeto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main  class="content-container">
        
        <!-- Seção de Vídeos / Cards -->
        <section id="destaques" class="cards-section">
            <h2 class="section-title">Últimas Análises</h2>
            
            <div class="cards-grid">
                <!-- Card 1: Doomsday -->
                <article class="card">
                    <div class="video-wrapper">
                        <!-- Placeholder para o Iframe do YouTube/TikTok -->
                        <div class="video-placeholder"></div>
                    </div>
                    <div class="card-body">
                        <span class="tag">Marvel</span>
                        <h3>Os Bastidores de Vingadores: Doomsday</h3>
                        <p>Análise completa dos custos de produção e o retorno do elenco.</p>
                    </div>
                </article>
            </div>
        </section>

    </main>

    <!-- Rodapé -->
    <footer class="main-footer">
        <p &copy; 2026 - Desenvolvido como projeto de portfólio em HTML5 e CSS3 puro.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
