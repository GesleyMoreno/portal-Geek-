<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeekPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="main-header">
    <div class="header-container">
      <h1 class="logo">Geek<span>Portal</span></h1>
      <nav class="main-nav">
        <ul>
          <li><a href="#">Destaques</a></li>
          <li><a href="#">Curiosidades</a></li>
          <li><a href="#">Sobre o Projeto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="content-container">
    <h2 class="section-title">Últimas Análises</h2>

    <!-- Botões de Categoria -->
    <div class="filter-buttons">
      <button class="btn-filter active" data-category="todos">Todos</button>
      <button class="btn-filter" data-category="Marvel">Marvel</button>
      <button class="btn-filter" data-category="Animes">Animes</button>
      <button class="btn-filter" data-category="Séries">Séries</button>
    </div>

    <!-- Campo de Busca -->
    <div class="search-container">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Pesquisar por título, categoria ou conteúdo..." 
      />
    </div>

    <!-- Grelha de Cards (O JavaScript irá preencher esta área) -->
    <div class="cards-grid"></div>
  </main>

  <!-- Rodapé -->
  <footer>
    <p>&copy; 2026 - Desenvolvido como projeto de portfólio em HTML5, CSS3 e JavaScript puro.</p>
  </footer>

  <!-- Script JS carregado no final do body -->
  <script src="script.js"></script>
</body>
</html>
